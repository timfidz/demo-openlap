<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050506">
  <meta name="robots" content="noindex, nofollow">
  <title>OPENLAP</title>
  <meta name="description" content="OPENLAP, karting indoor électrique haut de gamme en Île-de-France. Ouverture prochaine.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="polices/inter.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Inter";
      src: url("polices/inter.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --fond: #050506;
      --blanc: #f5f5f6;
      --voile: #8e8e96;
      --rouge: #e10600;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--blanc);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Une affiche : le logo, la piste, le bouton */
    .ecran {
      height: 100vh; height: 100svh; min-height: 480px;
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; justify-items: center;
      gap: clamp(12px, 2.6vh, 28px); padding: clamp(22px, 4.5vh, 48px) 20px 12px;
      text-align: center;
    }

    /* pas d'opacité 0 au départ : le navigateur doit compter le logo comme contenu affiché */
    .marque { line-height: 0; opacity: .01; animation: paraitre 2.2s ease .6s forwards; }
    .marque img { display: block; height: auto; width: min(86vw, clamp(84px, 17vh, 168px) * 3.754); /* 3,754 : largeur sur hauteur du logo */ }
    .cache { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    /* La piste et la lumière */
    .piste { position: relative; width: 100%; max-width: 1180px; container-type: size; }
    /* overflow visible : le halo de la lumière ne doit pas être coupé au bord du dessin */
    .piste svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
    @media (orientation: portrait) {
      /* Sur un écran en hauteur, la piste est tournée d'un quart de tour pour occuper la place */
      .piste svg {
        inset: auto; top: 50%; left: 50%;
        width: 100cqh; height: 100cqw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

    .bas { display: grid; justify-items: center; }
    .phrase {
      margin: 0 0 clamp(12px, 2.4vh, 22px);
      font-size: clamp(14px, 1.5vw, 17px); font-weight: 300; letter-spacing: .08em; color: var(--voile);
      opacity: 0; animation: paraitre 1.4s ease .9s forwards;
    }
    .phrase:empty { display: none; }
    .bouton {
      display: inline-block; padding: 13px 36px;
      font-size: 13px; font-weight: 400; letter-spacing: .24em; text-transform: uppercase; text-decoration: none;
      color: var(--blanc); border: 1px solid #f5f5f647; border-radius: 999px;
      transition: color .35s, background .35s, border-color .35s;
      opacity: 0; animation: paraitre 1.4s ease 1s forwards;
    }
    .bouton span { margin-right: -.24em; }
    .bouton:hover { color: var(--fond); background: var(--blanc); border-color: var(--blanc); }
    .bouton:focus-visible { outline: 2px solid var(--blanc); outline-offset: 5px; }
    @keyframes paraitre { to { opacity: 1; } }

    .pied {
      margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--voile);
      opacity: 0; animation: paraitre 1.4s ease 1.3s forwards;
    }
    .pied a { color: inherit; text-decoration: none; padding: 8px; }
    .pied a:hover, .pied a:focus-visible { color: var(--blanc); }
  </style>
</head>
<body>
  <main class="ecran">
    <div class="marque">
      <img src="images/logo-openlap-70.png" width="1554" height="538" alt="">
      <h1 class="cache" data-texte="nom">OPENLAP</h1>
    </div>

    <div class="piste" aria-hidden="true">
      <svg viewBox="47 13 1421 912" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- Le tracé du circuit du client : l'axe de la piste, relevé sur son plan type (releve-plan.json) -->
          <path id="trace" d="M 330 851 L 1300 851 C 1345 851 1380 816 1380 771 L 1380 150 C 1380 108 1352 88 1318 88 C 1283 88 1255 108 1255 150 L 1255 680 C 1255 715 1232 739 1196 739 L 770 739 C 700 739 645 720 645 660 C 645 600 700 570 745 540 C 780 515 797 480 797 440 L 797 270 C 797 215 840 195 877 195 C 914 195 957 215 957 270 L 957 560 C 957 600 990 626 1034 626 C 1080 626 1112 600 1112 560 L 1112 150 C 1112 118 1086 92 1054 92 L 712 92 C 678 92 652 118 652 152 L 652 480 C 652 522 622 545 582 545 C 542 545 512 522 512 480 L 512 150 C 512 115 486 86 454 86 L 190 86 C 155 86 130 110 130 146 L 130 300 C 130 340 155 362 190 362 C 225 362 250 340 250 300 L 250 250 C 250 212 280 190 314 190 C 350 190 380 212 380 250 L 380 520 C 380 620 330 655 255 690 C 115 755 75 851 255 851 Z"/>
          <!-- Les deux bords de la piste, calculés par le script à partir du tracé -->
          <path id="bord-dedans"/>
          <path id="bord-dehors"/>
          <radialGradient id="phare">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".14" stop-color="#f3f6ff" stop-opacity=".8"/>
            <stop offset=".45" stop-color="#e6ecff" stop-opacity=".13"/>
            <stop offset="1" stop-color="#e6ecff" stop-opacity="0"/>
          </radialGradient>
          <mask id="eclairage" maskUnits="userSpaceOnUse" x="0" y="0" width="1500" height="1049">
            <rect width="1500" height="1049" fill="#000"/>
            <!-- L'éclairage avance le long du tracé, jamais en cercle autour de la lumière :
                 les deux bords de la piste s'allument au même niveau, même dans un virage.
                 Sa largeur est celle de la piste : il ne déborde pas sur les couloirs voisins.
                 Chaque bande éclaire une longueur derrière la lumière, rien devant (en unités du tracé, ou en part du tour). -->
            <g fill="none" stroke="#fff" stroke-width="72" id="sillage">
              <use href="#trace" stroke-opacity=".26" data-arriere=".26t"/>
              <use href="#trace" stroke-opacity=".4" data-arriere=".11t"/>
              <use href="#trace" stroke-opacity=".16" data-arriere="300"/>
              <use href="#trace" stroke-opacity=".22" data-arriere="220"/>
              <use href="#trace" stroke-opacity=".3" data-arriere="140"/>
              <use href="#trace" stroke-opacity=".45" data-arriere="70"/>
            </g>
          </mask>
        </defs>

        <!-- Toute la piste reste visible, faiblement éclairée : le sol, et en très atténué les vibreurs, la grille et le damier -->
        <use href="#trace" fill="none" stroke="#0e0e10" stroke-width="58" stroke-linejoin="round"/>
        <g fill="none" stroke-linejoin="round" opacity=".3">
          <g stroke-width="4">
            <use href="#bord-dedans" stroke="#e10600"/><use href="#bord-dedans" stroke="#050506" stroke-dasharray="26 26"/>
            <use href="#bord-dehors" stroke="#e10600"/><use href="#bord-dehors" stroke="#050506" stroke-dasharray="26 26"/>
          </g>
          <path d="M 690 830 H 706 V 872 H 690 M 785 830 H 801 V 872 H 785 M 880 830 H 896 V 872 H 880 M 975 830 H 991 V 872 H 975 M 1070 830 H 1086 V 872 H 1070 M 1160 830 H 1176 V 872 H 1160" stroke="#f5f5f6" stroke-width="2"/>
          <g stroke="none" fill="#f5f5f6"><rect x="1255" y="824" width="9" height="9"/><rect x="1264" y="833" width="9" height="9"/><rect x="1255" y="842" width="9" height="9"/><rect x="1264" y="851" width="9" height="9"/><rect x="1255" y="860" width="9" height="9"/><rect x="1264" y="869" width="9" height="9"/></g>
        </g>

        <!-- La même piste en pleine lumière, révélée par le masque au passage de la lumière : le sol, les vibreurs rouge et noir sur les deux bords, la grille et le damier de départ -->
        <g mask="url(#eclairage)" fill="none" stroke-linejoin="round">
          <use href="#trace" stroke="#17171a" stroke-width="60"/>
          <g stroke-width="4">
            <use href="#bord-dedans" stroke="#e10600"/><use href="#bord-dedans" stroke="#050506" stroke-dasharray="26 26"/>
            <use href="#bord-dehors" stroke="#e10600"/><use href="#bord-dehors" stroke="#050506" stroke-dasharray="26 26"/>
          </g>
          <path d="M 690 830 H 706 V 872 H 690 M 785 830 H 801 V 872 H 785 M 880 830 H 896 V 872 H 880 M 975 830 H 991 V 872 H 975 M 1070 830 H 1086 V 872 H 1070 M 1160 830 H 1176 V 872 H 1160" stroke="#f5f5f6" stroke-width="2"/>
          <g stroke="none" fill="#f5f5f6"><rect x="1255" y="824" width="9" height="9"/><rect x="1264" y="833" width="9" height="9"/><rect x="1255" y="842" width="9" height="9"/><rect x="1264" y="851" width="9" height="9"/><rect x="1255" y="860" width="9" height="9"/><rect x="1264" y="869" width="9" height="9"/></g>
        </g>

        <!-- Le trait de lumière et le phare -->
        <use id="filet" href="#trace" fill="none" stroke="#f3f6ff" stroke-width="2" stroke-linecap="round" stroke-opacity=".9"/>
        <circle id="lueur" r="105" fill="url(#phare)"/>
        <circle id="point" r="5.5" fill="#fff"/>
      </svg>
    </div>

    <div class="bas">
      <p class="phrase" data-texte="phrase"></p>
      <a class="bouton" data-courriel href="mailto:contact@exemple.fr"><span data-texte="bouton">Contact</span></a>
    </div>

    <p class="pied"><a href="mentions-legales.html">Mentions légales</a></p>
  </main>

  <script>
    (function () {
      var trace = document.getElementById('trace');
      var total = trace.getTotalLength();
      var lueur = document.getElementById('lueur');
      var point = document.getElementById('point');
      var filet = document.getElementById('filet');
      var sillage = document.querySelectorAll('#sillage use');
      // Longueur de piste éclairée derrière la lumière, pour chaque bande du masque
      function longueur(texte) { return !texte ? 0 : texte.slice(-1) === 't' ? parseFloat(texte) * total : parseFloat(texte); }
      var bandes = [].map.call(sillage, function (u) { return longueur(u.dataset.arriere); });
      var filetLong = 0.12 * total;
      var depart = 600;          // le point de départ, en unités du tracé : sur la grille, avant la ligne
      var tour = 18000;          // durée d'un tour, en ms

      // Les vibreurs suivent chaque bord de la piste : leurs blocs gardent la même longueur
      // à l'intérieur et à l'extérieur des virages (un pointillé posé sur l'axe s'étirerait dehors et se tasserait dedans)
      // Le tracé est mesuré une seule fois (c'est la partie lente), puis les deux bords sont déduits des mêmes points
      (function () {
        var pas = 8, pts = [];
        for (var s = 0; s < total; s += pas) pts.push(trace.getPointAtLength(s));
        var n = pts.length, dedans = '', dehors = '';
        for (var i = 0; i < n; i++) {
          var avant = pts[(i - 1 + n) % n], apres = pts[(i + 1) % n];
          var tx = apres.x - avant.x, ty = apres.y - avant.y, l = Math.hypot(tx, ty) || 1;
          var nx = -ty / l * 31, ny = tx / l * 31, c = i ? 'L' : 'M';
          dedans += c + (pts[i].x + nx).toFixed(1) + ' ' + (pts[i].y + ny).toFixed(1);
          dehors += c + (pts[i].x - nx).toFixed(1) + ' ' + (pts[i].y - ny).toFixed(1);
        }
        document.getElementById('bord-dedans').setAttribute('d', dedans + 'Z');
        document.getElementById('bord-dehors').setAttribute('d', dehors + 'Z');
      })();

      function placer(avance) {
        var pos = (depart + avance) % total;
        var p = trace.getPointAtLength(pos);
        lueur.setAttribute('cx', p.x); lueur.setAttribute('cy', p.y);
        point.setAttribute('cx', p.x); point.setAttribute('cy', p.y);
        for (var i = 0; i < sillage.length; i++) {
          var l = Math.min(bandes[i], avance);
          sillage[i].setAttribute('stroke-dasharray', l + ' ' + (total - l));
          sillage[i].setAttribute('stroke-dashoffset', -(pos - l));
        }
        var f = Math.min(filetLong, avance);
        filet.setAttribute('stroke-dasharray', f + ' ' + (total - f));
        filet.setAttribute('stroke-dashoffset', -(pos - f));
      }

      // ?fige=0.45 arrête la lumière à 45 % du tour : sert aux captures
      var fige = new URLSearchParams(location.search).get('fige');
      // La lumière tourne même si l'appareil demande moins d'animations : elle est l'objet de la page
      if (fige !== null) {
        placer(parseFloat(fige) * total + total);
      } else {
        var debut = null;
        placer(0);
        requestAnimationFrame(function image(t) {
          if (debut === null) debut = t + 500;
          var ecoule = Math.max(0, t - debut);
          // Départ en douceur sur le premier tiers de tour, puis vitesse constante
          var tours = ecoule / tour;
          var avance = tours < 0.3 ? (tours * tours) / 0.6 : tours - 0.15;
          placer(avance * total);
          requestAnimationFrame(image);
        });
      }
    })();
  </script>
</body>
</html>
